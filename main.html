<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
	<div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>
//Your code goes here 

let container = document.querySelector(".items");
let cubes = document.querySelectorAll(".item");

cubes.forEach((cube) => {

    let startX = 0;
    let startY = 0;

    let initialX = 0;
    let initialY = 0;

    cube.addEventListener("mousedown", (e) => {

        // Prevent default browser behavior
        e.preventDefault();

        // Get cube position
        let rect = cube.getBoundingClientRect();
        let containerRect = container.getBoundingClientRect();

        // Store initial position
        initialX = rect.left - containerRect.left;
        initialY = rect.top - containerRect.top;

        // Store mouse position
        startX = e.clientX;
        startY = e.clientY;

        cube.classList.add("dragging");

        // Mouse movement
        function mouseMove(e) {

            let dx = e.clientX - startX;
            let dy = e.clientY - startY;

            // Calculate new position
            let newX = initialX + dx;
            let newY = initialY + dy;

            // Restrict movement inside container
            let maxX = container.clientWidth - cube.offsetWidth;
            let maxY = container.clientHeight - cube.offsetHeight;

            newX = Math.max(0, Math.min(newX, maxX));
            newY = Math.max(0, Math.min(newY, maxY));

            // Move cube
            let originalX = cube.offsetLeft;
            let originalY = cube.offsetTop;

            cube.style.transform =
                `translate(${newX - originalX}px, ${newY - originalY}px)`;
        }

        // Mouse release
        function mouseUp() {

            cube.classList.remove("dragging");

            document.removeEventListener("mousemove", mouseMove);
            document.removeEventListener("mouseup", mouseUp);

        }

        document.addEventListener("mousemove", mouseMove);
        document.addEventListener("mouseup", mouseUp);

    });

});
</script>
  </body>
</html>
